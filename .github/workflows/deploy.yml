name: Build and deploy user-service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 
      
      - name: Login to Github Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
      - name: Build image
        run: |
          docker build -t ghcr.io/webcraftersgh/user-service/users-service:latest .
          docker build -t ghcr.io/webcraftersgh/user-service/users-service:${{ github.sha }} .
      
      - name: Push image
        run: |
          docker push ghcr.io/webcraftersgh/user-service/users-service:latest
          docker push ghcr.io/webcraftersgh/user-service/users-service:${{ github.sha }}

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/LearnFlow-Launcher
            docker compose pull users-service
            docker compose up -d --no-deps users-service
            docker image prune -f
